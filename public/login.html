<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink: #0d0d14;
      --ink-soft: #3a3a4a;
      --ink-faint: #8888a0;
      --accent: #c9473b;
      --accent-hover: #b03830;
      --surface: #ffffff;
      --surface-dim: #f4f3f0;
      --border: #e2e0db;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.06);
      --shadow-md: 0 12px 48px rgba(0,0,0,.12), 0 4px 16px rgba(0,0,0,.06);
      --radius: 4px;
    }

    html, body {
      height: 100%;
      font-family: 'DM Sans', sans-serif;
      background: var(--surface-dim);
      color: var(--ink);
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      background-image:
        radial-gradient(ellipse 60% 50% at 20% 20%, rgba(201,71,59,.07) 0%, transparent 60%),
        radial-gradient(ellipse 50% 60% at 80% 80%, rgba(13,13,20,.05) 0%, transparent 60%);
    }

    /* ── Decorative lines ── */
    body::before, body::after {
      content: '';
      position: fixed;
      pointer-events: none;
    }
    body::before {
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: .6;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      padding: 52px 48px 48px;
      position: relative;
      animation: rise .55s cubic-bezier(.16,1,.3,1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(22px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* corner accent */
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0;
      width: 56px; height: 56px;
      border-top: 2px solid var(--accent);
      border-left: 2px solid var(--accent);
      border-radius: var(--radius) 0 0 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .brand-mark {
      width: 32px; height: 32px;
      background: var(--ink);
      border-radius: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .brand-mark span {
      color: white;
      font-family: 'Cormorant Garamond', serif;
      font-size: 18px;
      font-weight: 600;
      line-height: 1;
    }
    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: .03em;
      color: var(--ink);
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 300;
      letter-spacing: -.01em;
      color: var(--ink);
      line-height: 1.15;
      margin-bottom: 8px;
    }
    .subtitle {
      font-size: 13.5px;
      color: var(--ink-faint);
      margin-bottom: 36px;
    }

    .field {
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 11px;
      font-weight: 500;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 8px;
    }

    .input-wrap {
      position: relative;
    }
    .input-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 15px; height: 15px;
      color: var(--ink-faint);
      pointer-events: none;
      transition: color .2s;
    }

    input {
      width: 100%;
      height: 46px;
      padding: 0 14px 0 40px;
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      color: var(--ink);
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: var(--radius);
      outline: none;
      transition: border-color .2s, box-shadow .2s;
    }
    input::placeholder { color: var(--ink-faint); }
    input:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 3px rgba(13,13,20,.07);
    }
    input:focus + svg, .input-wrap:focus-within svg { color: var(--ink); }

    .input-wrap svg { right: unset; } /* ensure icon is on left */

    /* password toggle */
    .toggle-pass {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: var(--ink-faint);
      padding: 0;
      display: flex;
      align-items: center;
      transition: color .2s;
    }
    .toggle-pass:hover { color: var(--ink); }

    .forgot {
      display: flex;
      justify-content: flex-end;
      margin-top: 6px;
    }
    .forgot a {
      font-size: 12px;
      color: var(--ink-faint);
      text-decoration: none;
      transition: color .2s;
    }
    .forgot a:hover { color: var(--accent); }

    /* ── Error banner ── */
    .error-banner {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      background: #fff5f5;
      border: 1px solid #fecaca;
      border-radius: var(--radius);
      margin-bottom: 20px;
      animation: shake .35s cubic-bezier(.36,.07,.19,.97);
    }
    .error-banner.visible { display: flex; }
    .error-banner svg { flex-shrink: 0; color: var(--accent); }
    .error-banner p { font-size: 13px; color: var(--accent); }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      60%      { transform: translateX(5px); }
      80%      { transform: translateX(-3px); }
    }

    /* ── Submit button ── */
    .btn {
      width: 100%;
      height: 48px;
      margin-top: 28px;
      background: var(--ink);
      color: white;
      font-family: 'DM Sans', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      letter-spacing: .06em;
      text-transform: uppercase;
      border: none;
      border-radius: var(--radius);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: background .2s, transform .15s;
      position: relative;
      overflow: hidden;
    }
    .btn:hover { background: #1e1e30; }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .btn .spinner {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;
      border-radius: 50%;
      animation: spin .6s linear infinite;
    }
    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .divider {
      display: flex;
      align-items: center;
      gap: 14px;
      margin: 28px 0 0;
    }
    .divider hr { flex: 1; border: none; border-top: 1px solid var(--border); }
    .divider span { font-size: 11px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; }

    .signup-link {
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--ink-faint);
    }
    .signup-link a {
      color: var(--ink);
      font-weight: 500;
      text-decoration: none;
      border-bottom: 1px solid var(--border);
      transition: border-color .2s;
    }
    .signup-link a:hover { border-color: var(--ink); }

    /* hint for demo */
    .demo-hint {
      margin-top: 28px;
      padding: 12px 16px;
      background: #f7f6f3;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      font-size: 12px;
      color: var(--ink-faint);
      line-height: 1.6;
    }
    .demo-hint strong { color: var(--ink-soft); }

    @media (max-width: 480px) {
      .card { padding: 40px 28px 36px; }
    }
  </style>
</head>
<body>

<div class="card">
  <div class="brand">
    <div class="brand-mark"><span>A</span></div>
    <span class="brand-name">Apex</span>
  </div>

  <h1>Welcome<br>back.</h1>
  <p class="subtitle">Sign in to continue to your account.</p>

  <!-- Error Banner -->
  <div class="error-banner" id="errorBanner" role="alert">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <p id="errorMsg">Invalid email or password.</p>
  </div>

  <!-- Form -->
  <form id="loginForm" novalidate>
    <div class="field">
      <label for="email">Email address</label>
      <div class="input-wrap">
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 7l10 7 10-7"/>
        </svg>
      </div>
    </div>

    <div class="field">
      <label for="password">Password</label>
      <div class="input-wrap">
        <input type="password" id="password" name="password" placeholder="••••••••" autocomplete="current-password" />
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        <button type="button" class="toggle-pass" id="togglePass" aria-label="Toggle password visibility">
          <svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="forgot"><a href="#">Forgot password?</a></div>
    </div>

    <button type="submit" class="btn" id="submitBtn">
      <span class="btn-text">Sign In</span>
      <div class="spinner"></div>
    </button>
  </form>

  <div class="divider"><hr /><span>New here?</span><hr /></div>
  <p class="signup-link"><a href="#">Create an account</a></p>

  <div class="demo-hint">
    <strong>Demo credentials —</strong><br>
    Email: <strong>user@example.com</strong><br>
    Password: <strong>password123</strong>
  </div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const emailInput = document.getElementById('email');
  const passwordInput = document.getElementById('password');
  const errorBanner = document.getElementById('errorBanner');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');
  const togglePass = document.getElementById('togglePass');

  // ── Toggle password visibility ──
  togglePass.addEventListener('click', () => {
    const isText = passwordInput.type === 'text';
    passwordInput.type = isText ? 'password' : 'text';
    togglePass.innerHTML = isText
      ? `<svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
           <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
         </svg>`
      : `<svg id="eyeIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
           <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
           <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
           <line x1="1" y1="1" x2="23" y2="23"/>
         </svg>`;
  });

  // ── Show error ──
  function showError(msg) {
    errorMsg.textContent = msg;
    errorBanner.classList.remove('visible');
    void errorBanner.offsetWidth; // reflow for re-animation
    errorBanner.classList.add('visible');
  }

  // ── Submit ──
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBanner.classList.remove('visible');

    const email = emailInput.value.trim();
    const password = passwordInput.value;

    // Client-side validation
    if (!email) { showError('Email address is required.'); emailInput.focus(); return; }
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { showError('Please enter a valid email address.'); emailInput.focus(); return; }
    if (!password) { showError('Password is required.'); passwordInput.focus(); return; }

    // Loading state
    submitBtn.disabled = true;
    submitBtn.classList.add('loading');

    try {
      const res = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();

      if (data.success) {
        window.location.href = data.redirect || '/home';
      } else {
        showError(data.message || 'Login failed. Please try again.');
      }
    } catch (err) {
      showError('Network error. Please check your connection.');
    } finally {
      submitBtn.disabled = false;
      submitBtn.classList.remove('loading');
    }
  });
</script>
</body>
</html>
